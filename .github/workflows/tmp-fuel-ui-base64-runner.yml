name: Temporary FUEL UI Base64 Runner

on:
  push:
    branches: [ agent/fix-valve-safety ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/fix-valve-safety
          fetch-depth: 0

      - name: Apply guarded UI patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          payload = (
          ""
          ""
          ""
          ""
          ""
          ""
          ""
          )
          exec(compile(base64.b64decode(payload).decode("utf-8"), "<fuel-ui-patcher>", "exec"))
          PY

      - name: Validate UI patch
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.2
          python3 tests/fuel_ui_visual_regression_test.py
          lua5.2 tests/fuel_router_edit_entry_test.lua
          lua5.2 tests/fuel_router_ui_render_smoke_test.lua
          lua5.2 tests/fuel_router_ui_multi_valve_chain_builder_test.lua
          lua5.2 tests/fuel_router_ui_teach_pulse_test.lua
          lua5.2 tests/fuel_ui_completion_bounds_test.lua
          lua5.2 tests/fuel_ui_completion_state_test.lua
          lua5.2 tests/ui_dirty_redraw_test.lua
          lua5.2 tools/offline_validate.lua
          python3 scripts/manifest_sync.py --check
          git diff --check

          set +e
          bash tools/run_lua_tests.sh lua5.2 > /tmp/full-lua.log 2>&1
          rc=$?
          set -e
          cat /tmp/full-lua.log
          if [ "$rc" -ne 0 ]; then
            failures="$(grep '^  - tests/' /tmp/full-lua.log || true)"
            expected='  - tests/sim_recorder_contract_test.lua'
            if [ "$failures" != "$expected" ]; then
              echo "Unexpected Lua-suite failures:" >&2
              printf '%s\n' "$failures" >&2
              exit 1
            fi
            echo "Only pre-existing sim_recorder_contract_test.lua baseline failure remains."
          fi

      - name: Commit and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/tmp-fuel-ui-screenshot-fix.yml
          rm -f .github/workflows/tmp-fuel-ui-fix-runner.yml
          rm -f .github/workflows/tmp-fuel-ui-base64-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix fuel monitor readability and router edit UX"
          git push origin HEAD:agent/fix-valve-safety
