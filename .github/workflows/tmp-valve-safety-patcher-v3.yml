name: Temporary Valve Safety Patcher V3

on:
  push:
    branches: [ agent/fix-valve-safety ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/fix-valve-safety
          fetch-depth: 0

      - name: Apply structural VALVE patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, zlib

          def load(path): return Path(path).read_text(encoding='utf-8').splitlines()
          def save(path, lines): Path(path).write_text('\n'.join(lines) + '\n', encoding='utf-8')
          def unique(lines, stripped, start=0):
              hits=[i for i,l in enumerate(lines[start:],start) if l.strip()==stripped]
              if len(hits)!=1: raise SystemExit(f'expected one {stripped!r}, got {len(hits)}')
              return hits[0]
          def first(lines, stripped, start=0):
              for i in range(start,len(lines)):
                  if lines[i].strip()==stripped: return i
              raise SystemExit(f'missing {stripped!r}')
          def comment(lines, prefix, start=0):
              for i in range(start,len(lines)):
                  if lines[i].strip().startswith(prefix): return i
              raise SystemExit(f'missing comment {prefix!r}')
          def indent_of(line): return line[:len(line)-len(line.lstrip())]

          valve_path='xreactor/nodes/valve/main.lua'
          v=load(valve_path)

          i=unique(v,'local current_high = config.default_blocked ~= false  -- true = blockiert (Fail-Safe-Default)')
          ind=indent_of(v[i]); v[i:i+1]=[ind+'local desired_high = config.default_blocked ~= false',ind+'local current_high = nil  -- nil = physischer Zustand noch nicht erfolgreich bestaetigt']

          i=unique(v,'local color = current_high and colors.red or colors.green')
          ind=indent_of(v[i]); v[i:i+1]=[ind+'local color',ind+'if not valve_initialized or last_write_error then',ind+'  color = colors.orange',ind+'else',ind+'  color = current_high and colors.red or colors.green',ind+'end']

          i=unique(v,'if valve_initialized and high == current_high then')
          ind=indent_of(v[i]); v.insert(i+1, ind+'  last_write_error = nil')

          i=unique(v,'last_write_error = tostring(err)')
          ind=indent_of(v[i]); v.insert(i+1, ind+'render_status_monitor()')

          i=unique(v,'apply_valve(current_high)'); v[i]=indent_of(v[i])+'apply_valve(desired_high)'

          start=unique(v,'local valve_modem = peripheral.find("modem", function(_, m) return m.isWireless and m.isWireless() end)')
          stop=comment(v,'-- Feature (2026-07-20): "Weg 3"',start)
          while stop>start and v[stop-1].strip()=='': stop-=1
          modem='''local function find_valve_modem()
            local configured = type(config.wireless_modem) == "string" and config.wireless_modem or nil
            if configured and configured ~= "" then
              local present_ok, present = pcall(peripheral.isPresent, configured)
              if present_ok and present then
                local wrap_ok, modem = pcall(peripheral.wrap, configured)
                if wrap_ok and modem and type(modem.isWireless) == "function" then
                  local wireless_ok, wireless = pcall(modem.isWireless)
                  if wireless_ok and wireless == true then return modem, configured, nil end
                end
              end
              return nil, configured, "konfiguriertes Wireless Modem nicht verfuegbar oder nicht wireless"
            end
            local resolved_name = nil
            local ok_find, modem = pcall(peripheral.find, "modem", function(name, m)
              if not m or type(m.isWireless) ~= "function" then return false end
              local wireless_ok, wireless = pcall(m.isWireless)
              if wireless_ok and wireless == true then resolved_name = name; return true end
              return false
            end)
            if ok_find and modem then return modem, resolved_name, nil end
            return nil, nil, "kein Wireless Modem gefunden"
          end

          local valve_modem, valve_modem_name, valve_modem_error = find_valve_modem()
          if valve_modem then
            local ok_open = pcall(valve_modem.open, constants.channels.VALVE)
            if ok_open then
              utils.log(CONFIG.LOG_PREFIX, "Eigener Ventil-Kanal " .. constants.channels.VALVE .. " geoeffnet via " .. tostring(valve_modem_name or "auto"), "INFO")
            else
              utils.log(CONFIG.LOG_PREFIX, "Ventil-Kanal " .. constants.channels.VALVE .. " konnte nicht geoeffnet werden", "ERROR")
            end
          else
            utils.log(CONFIG.LOG_PREFIX, "Ventil-Kanal inaktiv: " .. tostring(valve_modem_error or "kein Wireless Modem"), "ERROR")
          end'''.splitlines()
          v[start:stop]=modem

          dst=unique(v,'if message.dst ~= node_id then return end  -- nicht fuer diese Node bestimmt')
          ins='''if type(message.src) ~= "string" or message.src == "" then
            utils.log(CONFIG.LOG_PREFIX, "SET_VALVE ohne gueltige 'src' ignoriert", "WARN")
            return
          end
          if type(message.command_id) ~= "string" or message.command_id == "" then
            utils.log(CONFIG.LOG_PREFIX, "SET_VALVE ohne gueltige 'command_id' ignoriert", "WARN")
            return
          end
          if type(message.high) ~= "boolean" then
            utils.log(CONFIG.LOG_PREFIX, "SET_VALVE ohne gueltiges 'high' ignoriert", "WARN")
            return
          end'''.splitlines()
          base=indent_of(v[dst]); ins=[base+x for x in ins]; v[dst+1:dst+1]=ins

          pair=unique(v,'config.trusted_source = message.src')
          high=first(v,'if type(message.high) ~= "boolean" then',pair+1)
          # This original validation block is exactly four logical lines plus end.
          hend=first(v,'end',high+1)
          del v[high:hend+1]

          i=unique(v,'applied = (current_high == message.high)'); v[i]=indent_of(v[i])+'applied = valve_initialized and (current_high == message.high)'

          start=unique(v,'local STALE_COMMAND_S = 20')
          stop=comment(v,'-- Feature (2026-07-20): periodisches Polling',start)
          while stop>start and v[stop-1].strip()=='': stop-=1
          failsafe='''local STALE_COMMAND_S = 20
          local FAILSAFE_RETRY_MS = 2000
          local last_failsafe_attempt_ts = 0
          services:add({ name = "valve_failsafe", tick = function()
            local now_ms = os.epoch("utc")
            local age_s = last_command_ts and ((now_ms - last_command_ts) / 1000) or math.huge
            local needs_block = (not valve_initialized) or current_high ~= true
            local should_retry = (not valve_initialized) or age_s > STALE_COMMAND_S
            if needs_block and should_retry and (now_ms - last_failsafe_attempt_ts) >= FAILSAFE_RETRY_MS then
              last_failsafe_attempt_ts = now_ms
              if not valve_initialized then
                utils.log(CONFIG.LOG_PREFIX, "Aktorzustand unbestaetigt — Fail-Safe: BLOCKIERT wird erneut geschrieben", "WARN")
              else
                utils.log(CONFIG.LOG_PREFIX, string.format("Kein SET_VALVE seit %.0fs — Fail-Safe: Ventil wird blockiert", age_s), "WARN")
              end
              apply_valve(true)
            end
          end })'''.splitlines()
          v[start:stop]=failsafe

          start=unique(v,'local function build_status_payload()')
          stop=unique(v,'services:add(telemetry_service.new({',start)
          while stop>start and v[stop-1].strip()=='': stop-=1
          status='''local function build_status_payload()
            local master_reachable = comms:is_master_reachable()
            local actuator_ready = valve_initialized and last_write_error == nil
            valve_health.status = (master_reachable and actuator_ready) and health.status.OK or health.status.DEGRADED
            valve_health.reasons = {}
            if not master_reachable then valve_health.reasons[health.reasons.COMMS_DOWN] = true end
            if not actuator_ready then valve_health.reasons[health.reasons.CONTROL_DEGRADED] = true end
            valve_health.last_seen_ts = os.epoch("utc")
            return non_rt_payload.build_base({
              ts = os.epoch("utc"), role = config.role, node_id = node_id,
              health = { status = valve_health.status, reasons = health.reasons_list(valve_health), last_seen_ts = valve_health.last_seen_ts },
              master_connected = master_reachable,
              queue = comms and comms:get_diagnostics().queue_depth or 0,
            })
          end'''.splitlines()
          v[start:stop]=status

          start=unique(v,'heartbeat_state = function() return {')
          stop=first(v,'} end,',start)+1
          ind=indent_of(v[start])
          heartbeat='''heartbeat_state = function()
            local confirmed_blocked = nil
            if valve_initialized then confirmed_blocked = current_high end
            return {
              blocked = confirmed_blocked,
              actuator_initialized = valve_initialized,
              actuator_ready = valve_initialized and last_write_error == nil,
              write_error = last_write_error,
              actuator_name = sorter_resolved_name or config.sorter_name,
            }
          end,'''.splitlines()
          v[start:stop]=[ind+x for x in heartbeat]
          save(valve_path,v)

          router_path='xreactor/nodes/fuel/redstone_router.lua'
          r=load(router_path)
          ret=unique(r,'return r, nil')
          endi=first(r,'end',ret+1)
          helpers='''
          local NODE_ID_PATH = "/xreactor/config/node_id.txt"

          local function read_runtime_node_id()
            if type(fs) ~= "table" or type(fs.exists) ~= "function" or type(fs.open) ~= "function" then return nil end
            local ok_exists, exists = pcall(fs.exists, NODE_ID_PATH)
            if not ok_exists or not exists then return nil end
            local ok_open, handle = pcall(fs.open, NODE_ID_PATH, "r")
            if not ok_open or not handle then return nil end
            local ok_read, value = pcall(handle.readAll)
            pcall(handle.close)
            if not ok_read or type(value) ~= "string" then return nil end
            value = value:match("^%s*(.-)%s*$")
            if value == "" then return nil end
            return value
          end

          local function resolve_source_node_id(config)
            local persisted = read_runtime_node_id()
            if persisted then return persisted end
            local configured = config and config.node_id
            if type(configured) == "string" and configured ~= "" then return configured end
            if os and type(os.getComputerID) == "function" then return "node-" .. tostring(os.getComputerID()) end
            return nil
          end

          local function find_wireless_modem(config)
            local configured = config and type(config.wireless_modem) == "string" and config.wireless_modem or nil
            if configured and configured ~= "" then
              local present_ok, present = pcall(peripheral.isPresent, configured)
              if not present_ok or not present then return nil end
              local wrap_ok, modem = pcall(peripheral.wrap, configured)
              if not wrap_ok or not modem or type(modem.isWireless) ~= "function" then return nil end
              local wireless_ok, wireless = pcall(modem.isWireless)
              if wireless_ok and wireless == true then return modem end
              return nil
            end
            local ok_find, modem = pcall(peripheral.find, "modem", function(_, mm)
              if not mm or type(mm.isWireless) ~= "function" then return false end
              local wireless_ok, wireless = pcall(mm.isWireless)
              return wireless_ok and wireless == true
            end)
            if ok_find then return modem end
            return nil
          end'''.splitlines()
          r[endi+1:endi+1]=helpers

          start=unique(r,'local valve_modem = nil')
          cfg=unique(r,'config = opts.config or {},',start)
          ind=indent_of(r[start])
          replacement=[ind+'local router_config = opts.config or {}',ind+'local valve_modem = find_wireless_modem(router_config)',ind+'if valve_modem then pcall(valve_modem.open, constants.channels.VALVE) end',ind+'local self = {',ind+'  config = router_config,',ind+'  source_node_id = opts.node_id or resolve_source_node_id(router_config),']
          # cfg is inside local self block; replace through that line.
          r[start:cfg+1]=replacement

          seq=unique(r,'self._state.command_seq = (self._state.command_seq or 0) + 1')
          msg_end=first(r,'}',first(r,'local message = {',seq)+1)
          ind=indent_of(r[seq])
          block='''local source_node_id = self.source_node_id
          if type(source_node_id) ~= "string" or source_node_id == "" then
            self.warn_once("missing_valve_source_id", "RedstoneRouter: keine gueltige Runtime-Node-ID fuer SET_VALVE; Netzwerkschaltung verweigert")
            return false
          end
          self._state.command_seq = (self._state.command_seq or 0) + 1
          local command_id = source_node_id .. "-" .. tostring(os.epoch and os.epoch("utc") or 0) .. "-" .. tostring(self._state.command_seq)
          local key = valve.integrator .. "|" .. tostring(side)
          local message = {
            type = "SET_VALVE", src = source_node_id, dst = w.node_id,
            command_id = command_id, side = side, high = high, ts = os.epoch and os.epoch("utc") or 0,
          }'''.splitlines()
          r[seq:msg_end+1]=[ind+x for x in block]

          i=unique(r,'command_id = command_id, dst = w.node_id, side = side, high = high,')
          r[i]=indent_of(r[i])+'command_id = command_id, src = source_node_id, dst = w.node_id, side = side, high = high,'

          ack=unique(r,'if entry.command_id == message.command_id then')
          ind=indent_of(r[ack])
          add='''if message.src ~= entry.dst or message.dst ~= entry.src then
            self.warn_once("valve_ack_identity:" .. tostring(key) .. ":" .. tostring(message.command_id),
              "RedstoneRouter: VALVE_ACK mit unpassender src/dst-Identitaet ignoriert")
            return
          end'''.splitlines()
          r[ack+1:ack+1]=[ind+'  '+x for x in add]

          i=unique(r,'type = "SET_VALVE", src = self.config.node_id, dst = entry.dst,')
          r[i]=indent_of(r[i])+'type = "SET_VALVE", src = entry.src, dst = entry.dst,'
          save(router_path,r)

          # Version and manifest hashes.
          release=Path('xreactor/release.lua')
          s=release.read_text(encoding='utf-8')
          for old,new in [('beta-v505','beta-v506'),('manifest-v505','manifest-v506'),('manifest_version = 505','manifest_version = 506')]:
            if s.count(old)!=1: raise SystemExit('release metadata mismatch '+old)
            s=s.replace(old,new,1)
          release.write_text(s,encoding='utf-8')

          manifest=Path('xreactor/manifest.lua'); s=manifest.read_text(encoding='utf-8')
          for old,new in [('manifest_version = 505','manifest_version = 506'),('manifest_id = "manifest-v505"','manifest_id = "manifest-v506"')]:
            if s.count(old)!=1: raise SystemExit('manifest metadata mismatch '+old)
            s=s.replace(old,new,1)
          for rel in ['nodes/valve/main.lua','nodes/fuel/redstone_router.lua','release.lua']:
            data=(Path('xreactor')/rel).read_bytes(); size=len(data); crc=f'{zlib.crc32(data)&0xffffffff:08x}'
            pat=re.compile(r'(\{\s*path\s*=\s*"'+re.escape(rel)+r'"\s*,\s*size_bytes\s*=\s*)\d+(\s*,\s*hash\s*=\s*")[0-9a-f]+("[^\n]*\})')
            s,n=pat.subn(lambda m:f'{m.group(1)}{size}{m.group(2)}{crc}{m.group(3)}',s,count=1)
            if n!=1: raise SystemExit('manifest entry mismatch '+rel)
          manifest.write_text(s,encoding='utf-8')

          Path('tests/valve_safety_regression_test.py').write_text('''#!/usr/bin/env python3
          from pathlib import Path
          repo=Path(__file__).resolve().parents[1]
          valve=(repo/'xreactor/nodes/valve/main.lua').read_text(encoding='utf-8')
          router=(repo/'xreactor/nodes/fuel/redstone_router.lua').read_text(encoding='utf-8')
          assert 'local current_high = nil' in valve
          assert 'apply_valve(desired_high)' in valve
          assert 'local needs_block = (not valve_initialized) or current_high ~= true' in valve
          assert 'actuator_initialized = valve_initialized' in valve
          a=valve.index('if type(message.src) ~= "string" or message.src == "" then')
          b=valve.index('if type(message.command_id) ~= "string" or message.command_id == "" then')
          c=valve.index('if type(message.high) ~= "boolean" then')
          p=valve.index('config.trusted_source = message.src')
          assert a<p and b<p and c<p
          assert 'source_node_id = opts.node_id or resolve_source_node_id(router_config)' in router
          assert 'message.src ~= entry.dst or message.dst ~= entry.src' in router
          assert 'type = "SET_VALVE", src = entry.src, dst = entry.dst' in router
          print('valve_safety_regression_test.py: ok')
          ''',encoding='utf-8')

          Path('tests/redstone_router_valve_identity_test.lua').write_text('''package.path=table.concat({'./xreactor/?.lua','./xreactor/?/init.lua',package.path},';')
          local tx={}
          local modem={isWireless=function() return true end,open=function() end,transmit=function(_,_,m) tx[#tx+1]=m end}
          _G.fs={exists=function(p) return p=='/xreactor/config/node_id.txt' end,open=function() return {readAll=function() return 'node-77\\n' end,close=function() end} end}
          _G.peripheral={find=function(k,f) if k=='modem' and (not f or f('right',modem)) then return modem end end,isPresent=function() return false end,wrap=function() return nil end}
          _G.redstone={setOutput=function() end}
          package.loaded['nodes.fuel.redstone_router']=nil
          local lib=require('nodes.fuel.redstone_router')
          local router=lib.new({config={node_id='ROLE-DEFAULT',logistics={redstone_tree={{reactor='R1',path={{side='left',integrator='VALVE-1'}}}}}},comms={get_peers=function() return {['VALVE-1']={down=false}} end},log=function() end,warn_once=function() end})
          router:refresh(); assert(#tx>=1); local sent=tx[#tx]; assert(sent.src=='node-77'); assert(sent.command_id:match('^node%-77%-'))
          local key='VALVE-1|left'; local pending=assert(router._state.pending_valve_acks[key]); assert(pending.src=='node-77')
          router:handle_valve_ack({type='VALVE_ACK',command_id=pending.command_id,src='EVIL',dst='node-77',applied=true,high=true}); assert(router._state.pending_valve_acks[key])
          router:handle_valve_ack({type='VALVE_ACK',command_id=pending.command_id,src='VALVE-1',dst='wrong',applied=true,high=true}); assert(router._state.pending_valve_acks[key])
          router:handle_valve_ack({type='VALVE_ACK',command_id=pending.command_id,src='VALVE-1',dst='node-77',applied=true,high=true}); assert(router._state.pending_valve_acks[key]==nil)
          local ok,cid=router:_set_valve({side='left',integrator='VALVE-1'},false); assert(ok and cid); local retry=assert(router._state.pending_valve_acks[key]); retry.sent_ts=-4000; router:check_pending_acks(); local resent=tx[#tx]; assert(resent.command_id==cid and resent.src=='node-77')
          print('redstone_router_valve_identity_test.lua: ok')
          ''',encoding='utf-8')
          PY

      - name: Validate
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.2
          python3 tests/valve_safety_regression_test.py
          lua5.2 tests/redstone_router_valve_identity_test.lua
          lua5.2 tools/offline_validate.lua
          python3 scripts/manifest_sync.py --check
          git diff --check

      - name: Commit and remove patchers
        run: |
          rm -f .github/workflows/tmp-valve-safety-patcher.yml .github/workflows/tmp-valve-safety-patcher-v2.yml .github/workflows/tmp-valve-safety-patcher-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix valve safety state and protocol identity"
          git push origin HEAD:agent/fix-valve-safety
