name: Offline Lua Checks

on:
  push:
    branches: [ main, beta ]
  pull_request:
    branches: [ main, beta ]
  workflow_dispatch:

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Lua 5.2
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.2
      - name: Run offline validator
        run: |
          lua5.2 tools/offline_validate.lua
