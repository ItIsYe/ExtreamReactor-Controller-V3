name: temporary audit fix phase 5

on:
  push:
    branches:
      - agent/repo-safety-audit-fixes

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repo-safety-audit-fixes
          fetch-depth: 0
      - name: Apply guarded RT/persistence fixes
        run: |
          python3 .github/audit_fix_phase5.py
          git checkout -- .github/workflows/audit-fix-phase5.yml
      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.2
      - name: Validate manifest and syntax
        run: |
          lua5.2 tools/offline_validate.lua
          python3 tools/validate_manifest.py --strict
          python3 scripts/manifest_sync.py --check
      - name: Run regression suites
        run: |
          bash tools/run_lua_tests.sh lua5.2
          bash tools/run_python_tests.sh python3
      - name: Commit phase 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/audit_fix_phase5.py
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: confirm RT safe quiesce and persistent config state"
          git push origin HEAD:agent/repo-safety-audit-fixes
