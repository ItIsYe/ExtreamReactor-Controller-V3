name: Remote-Verifikation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # täglich 06:00 UTC

permissions:
  contents: read

jobs:
  remote-verify:
    name: Remote-Manifest prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Remote-Manifest verifizieren
        run: |
          python3 scripts/verify_remote_manifest.py             --ref beta             --repo ItIsYe/ExtreamReactor-Controller-V3             --report remote-verify-report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report als Artefakt speichern
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549e0f5d4ced429  # v4.6.0
        if: always()
        with:
          name: remote-verify-report
          path: remote-verify-report.json
