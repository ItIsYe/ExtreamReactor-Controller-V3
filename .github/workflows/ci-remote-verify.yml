name: Remote-Verifikation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # täglich 06:00 UTC

permissions:
  contents: read

jobs:
  remote-verify:
    name: Remote-Manifest prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Remote-Manifest verifizieren
        run: |
          # --base-url ist Pflicht: ohne sie ueberspringt das Skript die Pruefung
          # und meldet trotzdem Erfolg (--ref/--repo ignoriert es). Bis 2026-10
          # war dieser Lauf deshalb immer gruen, ohne je etwas zu pruefen.
          python3 scripts/verify_remote_manifest.py \
            --base-url https://raw.githubusercontent.com/ItIsYe/ExtreamReactor-Controller-V3/beta/xreactor \
            --ref beta \
            --repo ItIsYe/ExtreamReactor-Controller-V3 \
            --report remote-verify-report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report als Artefakt speichern
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-verify-report
          path: remote-verify-report.json
