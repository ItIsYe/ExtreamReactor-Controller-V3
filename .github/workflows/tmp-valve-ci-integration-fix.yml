name: Temporary VALVE CI Integration Fix

on:
  push:
    branches: [ agent/fix-valve-safety ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/fix-valve-safety
          fetch-depth: 0

      - name: Apply integration corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, zlib

          def text(path): return Path(path).read_text(encoding='utf-8')
          def write(path, value): Path(path).write_text(value, encoding='utf-8')
          def lines(path): return text(path).splitlines()
          def save_lines(path, value): write(path, '\n'.join(value) + '\n')
          def first_stripped(value, target, start=0):
              for i in range(start, len(value)):
                  if value[i].strip() == target:
                      return i
              raise SystemExit(f'missing structural marker: {target!r}')

          router = 'xreactor/nodes/fuel/redstone_router.lua'
          r = text(router)
          helper_start = r.index('local NODE_ID_PATH = "/xreactor/config/node_id.txt"')
          helper_end = r.index('local function find_wireless_modem(config)', helper_start)
          new_helper = '''local function resolve_source_node_id(opts, config)
            local explicit = opts and opts.node_id
            if type(explicit) == "string" and explicit ~= "" then return explicit end
            local configured = config and config.node_id
            if type(configured) == "string" and configured ~= "" then return configured end
            -- Backward-compatible fallback for direct library users/tests.
            -- Production FUEL/REPROCESSOR inject their resolved runtime node_id.
            return "FUEL"
          end

          '''
          r = r[:helper_start] + new_helper + r[helper_end:]
          old = 'source_node_id = opts.node_id or resolve_source_node_id(router_config),'
          if r.count(old) != 1: raise SystemExit('router constructor source id anchor mismatch')
          r = r.replace(old, 'source_node_id = resolve_source_node_id(opts, router_config),', 1)
          write(router, r)

          # FUEL already owns the resolved runtime node_id; inject it explicitly.
          p = 'xreactor/nodes/fuel/main.lua'
          ls = lines(p)
          ctor = first_stripped(ls, 'rs_router_instance = redstone_router_lib.new({')
          cfg = first_stripped(ls, 'config = config,', ctor + 1)
          if any(x.strip() == 'node_id = node_id,' for x in ls[ctor:cfg+4]):
              raise SystemExit('fuel node_id injection already present unexpectedly')
          indent = ls[cfg][:len(ls[cfg]) - len(ls[cfg].lstrip())]
          ls.insert(cfg + 1, indent + 'node_id = node_id,')
          save_lines(p, ls)

          # REPROCESSOR builds the shared router from config.feed, so root node_id
          # is not available inside config and must be injected as an explicit option.
          p = 'xreactor/nodes/reprocessor/main.lua'
          s = text(p)
          old = 'redstone_router_lib.new({ config = config.feed or {}, log ='
          new = 'redstone_router_lib.new({ config = config.feed or {}, node_id = node_id, log ='
          if s.count(old) != 1: raise SystemExit(f'reprocessor constructor anchor mismatch: {s.count(old)}')
          write(p, s.replace(old, new, 1))

          # Existing router ACK tests now model the complete identity-bearing protocol.
          for p in [
              'tests/redstone_router_flat_path_multi_valve_chain_test.lua',
              'tests/redstone_router_nested_multi_valve_chain_test.lua',
              'tests/redstone_router_stale_confirmed_state_test.lua',
              'tests/redstone_router_valve_confirmation_gate_test.lua',
          ]:
              s = text(p)
              old = "    type = 'VALVE_ACK', command_id = entry.command_id,\n    applied = applied, high = (high == nil) and entry.high or high,"
              new = "    type = 'VALVE_ACK', command_id = entry.command_id,\n    src = entry.dst, dst = entry.src,\n    applied = applied, high = (high == nil) and entry.high or high,"
              if s.count(old) != 1: raise SystemExit(f'{p}: ACK helper anchor mismatch, count={s.count(old)}')
              write(p, s.replace(old, new, 1))

          # New identity test exercises explicit runtime-id injection, not hidden fs lookup.
          p = 'tests/redstone_router_valve_identity_test.lua'
          ls = lines(p)
          fs_hits = [i for i, line in enumerate(ls) if line.strip().startswith('_G.fs=')]
          if len(fs_hits) != 1: raise SystemExit(f'identity test fs marker mismatch: {len(fs_hits)}')
          del ls[fs_hits[0]]
          ctor_hits = [i for i, line in enumerate(ls) if line.strip().startswith('local router=lib.new({config=')]
          if len(ctor_hits) != 1: raise SystemExit(f'identity test constructor mismatch: {len(ctor_hits)}')
          i = ctor_hits[0]
          ls[i] = ls[i].replace('local router=lib.new({config=', "local router=lib.new({node_id='node-77',config=", 1)
          save_lines(p, ls)

          p = 'tests/valve_safety_regression_test.py'
          s = text(p)
          old = "assert 'source_node_id = opts.node_id or resolve_source_node_id(router_config)' in router"
          new = "assert 'source_node_id = resolve_source_node_id(opts, router_config)' in router\nassert 'node_id = node_id' in (repo/'xreactor/nodes/fuel/main.lua').read_text(encoding='utf-8')\nassert 'node_id = node_id' in (repo/'xreactor/nodes/reprocessor/main.lua').read_text(encoding='utf-8')"
          if s.count(old) != 1: raise SystemExit('python regression source-id assertion mismatch')
          write(p, s.replace(old, new, 1))

          # Refresh manifest hashes/sizes for changed runtime files.
          manifest = Path('xreactor/manifest.lua')
          ms = manifest.read_text(encoding='utf-8')
          for rel in ['nodes/fuel/redstone_router.lua', 'nodes/fuel/main.lua', 'nodes/reprocessor/main.lua']:
              data = (Path('xreactor') / rel).read_bytes()
              size = len(data)
              crc = f'{zlib.crc32(data) & 0xffffffff:08x}'
              pat = re.compile(r'(\{\s*path\s*=\s*"' + re.escape(rel) + r'"\s*,\s*size_bytes\s*=\s*)\d+(\s*,\s*hash\s*=\s*")[0-9a-f]+("[^\n]*\})')
              ms, n = pat.subn(lambda m: f'{m.group(1)}{size}{m.group(2)}{crc}{m.group(3)}', ms, count=1)
              if n != 1: raise SystemExit(f'manifest entry mismatch for {rel}')
          manifest.write_text(ms, encoding='utf-8')
          PY

      - name: Validate focused and repository suites
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.2
          python3 tests/valve_safety_regression_test.py
          lua5.2 tests/redstone_router_valve_identity_test.lua
          lua5.2 tests/redstone_router_flat_path_multi_valve_chain_test.lua
          lua5.2 tests/redstone_router_nested_multi_valve_chain_test.lua
          lua5.2 tests/redstone_router_stale_confirmed_state_test.lua
          lua5.2 tests/redstone_router_valve_confirmation_gate_test.lua
          lua5.2 tools/offline_validate.lua
          python3 scripts/manifest_sync.py --check
          git diff --check

          set +e
          bash tools/run_lua_tests.sh lua5.2 > /tmp/full-lua.log 2>&1
          rc=$?
          set -e
          cat /tmp/full-lua.log
          if [ "$rc" -ne 0 ]; then
            failures="$(grep '^  - tests/' /tmp/full-lua.log || true)"
            expected='  - tests/sim_recorder_contract_test.lua'
            if [ "$failures" != "$expected" ]; then
              echo "Unexpected Lua-suite failures:" >&2
              printf '%s\n' "$failures" >&2
              exit 1
            fi
            echo "Only pre-existing sim_recorder_contract_test.lua baseline failure remains."
          fi

      - name: Commit correction and self-clean
        shell: bash
        run: |
          rm .github/workflows/tmp-valve-ci-integration-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix valve router runtime identity integration"
          git push origin HEAD:agent/fix-valve-safety
