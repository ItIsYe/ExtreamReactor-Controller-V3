name: temporary audit fix patcher

on:
  push:
    branches:
      - agent/repo-safety-audit-fixes

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repo-safety-audit-fixes
          fetch-depth: 0
      - name: Apply guarded fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("xreactor/nodes/fuel/main.lua")
          text = path.read_text(encoding="utf-8")
          old = "local FUEL_MONITOR_SCALE = 0.5"
          if text.count(old) != 1:
              raise SystemExit("FUEL monitor scale guard failed")
          path.write_text(text.replace(old, "local FUEL_MONITOR_SCALE = 1.0", 1), encoding="utf-8")
          PY
          python3 .github/audit_fix.py
          # The Actions token may not update workflow files. Keep them unchanged
          # in this bot commit; they are updated separately through GitHub.
          git checkout -- .github/workflows/offline-tests.yml .github/workflows/audit-fix-patcher.yml
      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.2
      - name: Validate syntax and manifests
        run: |
          lua5.2 tools/offline_validate.lua
          python3 tools/validate_manifest.py --strict
          python3 scripts/manifest_sync.py --check
      - name: Run regression suites
        run: |
          bash tools/run_lua_tests.sh lua5.2
          bash tools/run_python_tests.sh python3
      - name: Commit guarded fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: harden installer recovery and core safety"
          git push origin HEAD:agent/repo-safety-audit-fixes
