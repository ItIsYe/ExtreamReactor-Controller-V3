name: Temporary FUEL UI Fix Runner

on:
  push:
    branches: [ agent/fix-valve-safety ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/fix-valve-safety
          fetch-depth: 0

      - name: Apply guarded UI patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, zlib

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p, s): Path(p).write_text(s, encoding='utf-8')
          def once(path, old, new):
              s = read(path)
              n = s.count(old)
              if n != 1: raise SystemExit(f'{path}: expected 1 anchor, got {n}: {old[:100]!r}')
              write(path, s.replace(old, new, 1))

          p='xreactor/nodes/fuel/main.lua'; s=read(p)
          anchor='local fuel_ui = fuel_ui_pages.new({ ui = ui, colors = colors, support_ui_pages = support_ui_pages, utils = utils, config = config, devices = devices })\n'
          if s.count(anchor)!=1: raise SystemExit('fuel/main fuel_ui anchor')
          s=s.replace(anchor, anchor+'local FUEL_MONITOR_SCALE = 1.0\n',1)
          find='monitor_adapter.find(nil, "first", 0.5, CONFIG.LOG_PREFIX)'
          if s.count(find)!=2: raise SystemExit(f'fuel/main scale sites={s.count(find)}')
          s=s.replace(find,'monitor_adapter.find(nil, "first", FUEL_MONITOR_SCALE, CONFIG.LOG_PREFIX)')
          old='''        if #list == 0 and comms and type(comms.get_peers) == "function" then
          for _, peer in ipairs(comms:get_peers()) do
            if peer.role == "RT" then
              if not seen[peer.id] then seen[peer.id] = true; list[#list + 1] = { id = peer.id, label = peer.id } end
            end
          end
        end'''
          new='''        if #list == 0 and comms and type(comms.get_peers) == "function" then
          for peer_id, peer in pairs(comms:get_peers() or {}) do
            if type(peer) == "table" and peer.role == constants.roles.RT_NODE and peer.down ~= true then
              local id = tostring(peer_id)
              if not seen[id] then seen[id] = true; list[#list + 1] = { id = id, label = id } end
            end
          end
        end'''
          if s.count(old)!=1: raise SystemExit('fuel/main peer fallback anchor')
          s=s.replace(old,new,1); write(p,s)

          p='xreactor/nodes/fuel/monitor_ui.lua'; s=read(p)
          req='local ui_diagnostics_overlay = require("nodes.fuel.ui_diagnostics_overlay")\n'
          att='    ui_diagnostics_overlay.attach(ctx.fuel_ui)\n'
          if s.count(req)!=1 or s.count(att)!=1: raise SystemExit('monitor_ui overlay anchors')
          s=s.replace(req,'',1).replace(att,'',1); write(p,s)

          p='xreactor/nodes/fuel/ui_pages.lua'; s=read(p)
          old='''        text = string.format("UI: frames %d/%d/%d clears=%d trans=%d ptr=%d model=%d %dms",
          uidiag.frames_committed or 0, uidiag.frames_skipped or 0, uidiag.frames_requested or 0,
          uidiag.full_clears or 0, uidiag.transition_count or 0, uidiag.pointer_events_received or 0,
          uidiag.model_builds or 0, uidiag.last_render_ms or 0),'''
          new='''        text = string.format("UI: frames %d/%d/%d clears=%d trans=%d err=%d ptr=%d model=%d %dms",
          uidiag.frames_committed or 0, uidiag.frames_skipped or 0, uidiag.frames_requested or 0,
          uidiag.full_clears or 0, uidiag.transition_count or 0, uidiag.render_errors or uidiag.error_count or 0,
          uidiag.pointer_events_received or 0, uidiag.model_builds or 0, uidiag.last_render_ms or 0),'''
          if s.count(old)!=1: raise SystemExit('ui_pages diagnostics anchor')
          write(p,s.replace(old,new,1))

          p='xreactor/nodes/fuel/ui_completion.lua'; s=read(p)
          old='''local function footer(mon, h, w, center)
  return mux.footer_nav(mon, h, w, { center = center })
end'''
          new='''local function footer(mon, h, w, center)
  return mux.footer_nav(mon, h, w, { center = center, inset = 3 })
end'''
          if s.count(old)!=1: raise SystemExit('ui_completion footer anchor')
          s=s.replace(old,new,1)
          old='''    if #reactors > 0 and y < h - 1 then
      local counts = logistics.operational_counts or {}'''
          new='''    if #reactors == 0 and y < h - 1 then
      y = data_row(mon, w, h, y, {
        label = "NAECHSTER SCHRITT", value = "ROUTER > EDIT / RT-NODE ONLINE",
        status = "LIMITED", icon = "config"
      })
    end

    if #reactors > 0 and y < h - 1 then
      local counts = logistics.operational_counts or {}'''
          if s.count(old)!=1: raise SystemExit('ui_completion overview anchor')
          s=s.replace(old,new,1)
          old='''    if #reactors == 0 then
      if h >= 5 then mux.banner(mon, 2, 5, math.max(1, w - 3), "KEINE REAKTOREN KONFIGURIERT", "WARNING", nil) end
      state.details_prev, state.details_next = nil, nil
      return footer(mon, h, w, "FUEL DETAILS")
    end'''
          new='''    if #reactors == 0 then
      if h >= 5 then mux.banner(mon, 2, 5, math.max(1, w - 3), "KEINE REAKTOREN KONFIGURIERT", "WARNING", nil) end
      if h >= 14 then
        mux.warning_box(mon, 2, 7, math.max(1, w - 3), {
          "Noch keine Reaktor-Ziele vorhanden",
          "RT-Nodes online bringen oder logistics.reactors konfigurieren",
          "Danach Seite 4 ROUTER oeffnen und EDIT waehlen",
          "Dort Reaktor antippen und Ventilkette festlegen",
        }, "WARNING")
      elseif h >= 8 then
        mux.data_row(mon, 2, 7, math.max(1, w - 3), { label = "NAECHSTER SCHRITT", value = "ROUTER > EDIT", status = "LIMITED", icon = "config" })
      end
      state.details_prev, state.details_next = nil, nil
      return footer(mon, h, w, "FUEL DETAILS")
    end'''
          if s.count(old)!=1: raise SystemExit('ui_completion details empty anchor')
          write(p,s.replace(old,new,1))

          p='xreactor/core/mockup_ui.lua'; s=read(p)
          old='''  local left_text = fit(left, math.floor(w / 3) - 1)
  write(mon, 2, y, left_text, colors.get("text"), colors.get("OFFLINE"))
  if center ~= "" then
    local cx = math.max(2, math.floor((w - #center) / 2))
    write(mon, cx, y, fit(center, math.floor(w / 3)), colors.get("muted"), colors.get("OFFLINE"))
  end
  local right_text = fit(right, math.floor(w / 3))
  local rx = math.max(2, w - #right_text - 1)
  write(mon, rx, y, right_text, colors.get("text"), colors.get("OFFLINE"))
  return {
    left = { x1 = 2, x2 = 2 + #left_text - 1, y = y },
    right = { x1 = rx, x2 = rx + #right_text - 1, y = y },
  }'''
          new='''  local inset = math.max(1, math.floor(tonumber(opts.inset) or 1))
  local left_text = fit(left, math.floor(w / 3) - 1)
  local lx = math.min(math.max(2, inset + 1), math.max(2, w - #left_text - 1))
  write(mon, lx, y, left_text, colors.get("text"), colors.get("OFFLINE"))
  if center ~= "" then
    local cx = math.max(2, math.floor((w - #center) / 2))
    write(mon, cx, y, fit(center, math.floor(w / 3)), colors.get("muted"), colors.get("OFFLINE"))
  end
  local right_text = fit(right, math.floor(w / 3))
  local rx = math.max(2, w - #right_text - inset)
  write(mon, rx, y, right_text, colors.get("text"), colors.get("OFFLINE"))
  return {
    left = { x1 = lx, x2 = lx + #left_text - 1, y = y },
    right = { x1 = rx, x2 = rx + #right_text - 1, y = y },
  }'''
          if s.count(old)!=1: raise SystemExit('mockup footer anchor')
          write(p,s.replace(old,new,1))

          p='xreactor/nodes/fuel/router_ui.lua'; s=read(p)
          if s.count('      tree_btn = nil, edit_btn = nil,\n')!=1: raise SystemExit('router state anchor')
          s=s.replace('      tree_btn = nil, edit_btn = nil,\n','      tree_btn = nil, edit_btn = nil, empty_edit_btn = nil,\n',1)
          old='''  if #rows == 0 then
    mux.warning_box(target, 4, first_y, left_w - 4, { "Keine Reaktor-Routen konfiguriert", "Auf Seite EDIT anlegen" }, "WARNING")
  end'''
          new='''  if #rows == 0 then
    mux.warning_box(target, 4, first_y, left_w - 4, { "Keine Reaktor-Routen konfiguriert", "EDIT oeffnen und Reaktor-Ziel waehlen" }, "WARNING")
    u.empty_edit_btn = nil
    local edit_y = first_y + 4
    if edit_y <= body_top + body_h - 2 then
      local targets = self.get_reactors()
      local hint = #targets > 0 and "ROUTEN JETZT BEARBEITEN" or "RT ONLINE / REAKTOR KONFIGURIEREN"
      mux.data_row(target, 4, edit_y, left_w - 4, { label = "[ EDIT ROUTEN ]", value = hint, status = "LIMITED", icon = "config" })
      u.empty_edit_btn = { x1 = 4, x2 = math.max(4, left_w - 1), y = edit_y }
    end
  else
    u.empty_edit_btn = nil
  end'''
          if s.count(old)!=1: raise SystemExit('router empty tree anchor')
          s=s.replace(old,new,1)
          old='''  mux.header(target, { title = "REDSTONE ROUTING", node_id = "FUEL NODE", page = "4/4", status = page_status, icon = "network" })
  self:_render_mode_tabs(target, ui, w)
  local footer_center'''
          new='''  mux.header(target, { title = "REDSTONE ROUTING", node_id = "FUEL NODE", page = "4/4", status = page_status, icon = "network" })
  local footer_center'''
          if s.count(old)!=1: raise SystemExit('router pre tabs anchor')
          s=s.replace(old,new,1)
          old='''  else
    self:_render_tree(target, ui, w, h)
    footer_center = "ROUTING TREE"
  end
  return mux.footer_nav(target, h, w, { center = footer_center })
end'''
          new='''  else
    self:_render_tree(target, ui, w, h)
    footer_center = "ROUTING TREE"
  end
  self:_render_mode_tabs(target, ui, w)
  return mux.footer_nav(target, h, w, { center = footer_center, inset = 3 })
end'''
          if s.count(old)!=1: raise SystemExit('router footer anchor')
          s=s.replace(old,new,1)
          old='''  if hit(u.edit_btn) then
    u.mode = "edit"
    u.edit_view = "list"
    u.editing = nil
    u.pending_side = nil
    return true
  end'''
          new='''  if hit(u.edit_btn) or hit(u.empty_edit_btn) then
    u.mode = "edit"
    u.edit_view = "list"
    u.editing = nil
    u.pending_side = nil
    return true
  end'''
          if s.count(old)!=1: raise SystemExit('router edit touch anchor')
          write(p,s.replace(old,new,1))

          p='xreactor/nodes/fuel/router_ui_responsive.lua'; s=read(p)
          old='    mux.warning_box(target, 4, first_y, w - 6, { "Keine Ziele gefunden", "Discovery pruefen" }, "WARNING")\n'
          new='    mux.warning_box(target, 4, first_y, w - 6, { "Keine Reaktor-Ziele gefunden", "RT-Nodes online oder logistics.reactors konfigurieren" }, "WARNING")\n'
          if s.count(old)!=1: raise SystemExit('responsive empty target anchor')
          write(p,s.replace(old,new,1))

          lines = [
              'from pathlib import Path',
              '',
              "repo = Path(__file__).resolve().parents[1]",
              "main = (repo/'xreactor/nodes/fuel/main.lua').read_text(encoding='utf-8')",
              "monitor_ui = (repo/'xreactor/nodes/fuel/monitor_ui.lua').read_text(encoding='utf-8')",
              "ui_pages = (repo/'xreactor/nodes/fuel/ui_pages.lua').read_text(encoding='utf-8')",
              "ui_completion = (repo/'xreactor/nodes/fuel/ui_completion.lua').read_text(encoding='utf-8')",
              "router = (repo/'xreactor/nodes/fuel/router_ui.lua').read_text(encoding='utf-8')",
              "responsive = (repo/'xreactor/nodes/fuel/router_ui_responsive.lua').read_text(encoding='utf-8')",
              "mockup = (repo/'xreactor/core/mockup_ui.lua').read_text(encoding='utf-8')",
              "assert 'local FUEL_MONITOR_SCALE = 1.0' in main",
              "assert main.count('monitor_adapter.find(nil, \\\"first\\\", FUEL_MONITOR_SCALE, CONFIG.LOG_PREFIX)') == 2",
              "assert 'for peer_id, peer in pairs(comms:get_peers() or {}) do' in main",
              "assert 'peer.role == constants.roles.RT_NODE' in main",
              "assert 'for _, peer in ipairs(comms:get_peers())' not in main",
              "assert 'ui_diagnostics_overlay.attach' not in monitor_ui",
              "assert 'require(\\\"nodes.fuel.ui_diagnostics_overlay\\\")' not in monitor_ui",
              "assert 'err=%d' in ui_pages",
              "assert 'NAECHSTER SCHRITT' in ui_completion and 'ROUTER > EDIT' in ui_completion",
              "assert 'inset = 3' in ui_completion",
              "render_start = router.index('function M:render(')",
              "render_end = router.index('function M:handle_touch', render_start)",
              "render_body = router[render_start:render_end]",
              "assert render_body.rfind('self:_render_mode_tabs') > render_body.rfind('self:_render_tree')",
              "assert 'empty_edit_btn' in router and '[ EDIT ROUTEN ]' in router",
              "assert 'if hit(u.edit_btn) or hit(u.empty_edit_btn) then' in router",
              "assert 'inset = 3' in render_body",
              "assert 'Keine Reaktor-Ziele gefunden' in responsive",
              "assert 'opts.inset' in mockup",
              "print('fuel_ui_visual_regression_test.py: ok')",
          ]
          write('tests/fuel_ui_visual_regression_test.py', '\n'.join(lines) + '\n')

          release='xreactor/release.lua'; rs=read(release)
          for old,new in [('release_id = "beta-v506"','release_id = "beta-v507"'),('manifest_id = "manifest-v506"','manifest_id = "manifest-v507"'),('manifest_version = 506','manifest_version = 507')]:
              if rs.count(old)!=1: raise SystemExit('release version anchor '+old)
              rs=rs.replace(old,new,1)
          write(release,rs)

          manifest='xreactor/manifest.lua'; ms=read(manifest)
          if ms.count('manifest_version = 506')!=1 or ms.count('manifest_id = "manifest-v506"')!=1: raise SystemExit('manifest version anchors')
          ms=ms.replace('manifest_version = 506','manifest_version = 507',1).replace('manifest_id = "manifest-v506"','manifest_id = "manifest-v507"',1)
          managed=['release.lua','core/mockup_ui.lua','nodes/fuel/main.lua','nodes/fuel/monitor_ui.lua','nodes/fuel/ui_pages.lua','nodes/fuel/ui_completion.lua','nodes/fuel/router_ui.lua','nodes/fuel/router_ui_responsive.lua']
          for rel in managed:
              data=(Path('xreactor')/rel).read_bytes(); size=len(data); crc=f'{zlib.crc32(data)&0xffffffff:08x}'
              pat=re.compile(r'(\{\s*path\s*=\s*"'+re.escape(rel)+r'"\s*,\s*size_bytes\s*=\s*)\d+(\s*,\s*hash\s*=\s*")[0-9a-f]+("[^\n]*\})')
              ms,n=pat.subn(lambda m:f'{m.group(1)}{size}{m.group(2)}{crc}{m.group(3)}',ms,count=1)
              if n!=1: raise SystemExit('manifest entry '+rel)
          write(manifest,ms)
          PY

      - name: Validate UI patch
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.2
          python3 tests/fuel_ui_visual_regression_test.py
          lua5.2 tests/fuel_router_ui_render_smoke_test.lua
          lua5.2 tests/fuel_router_ui_multi_valve_chain_builder_test.lua
          lua5.2 tests/fuel_router_ui_teach_pulse_test.lua
          lua5.2 tests/fuel_ui_completion_bounds_test.lua
          lua5.2 tests/fuel_ui_completion_state_test.lua
          lua5.2 tests/ui_dirty_redraw_test.lua
          lua5.2 tools/offline_validate.lua
          python3 scripts/manifest_sync.py --check
          git diff --check
          set +e
          bash tools/run_lua_tests.sh lua5.2 >/tmp/full-lua.log 2>&1
          rc=$?
          set -e
          cat /tmp/full-lua.log
          if [ "$rc" -ne 0 ]; then
            failures="$(grep '^  - tests/' /tmp/full-lua.log || true)"
            [ "$failures" = '  - tests/sim_recorder_contract_test.lua' ] || { echo "Unexpected failures: $failures" >&2; exit 1; }
          fi

      - name: Commit and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/tmp-fuel-ui-screenshot-fix.yml .github/workflows/tmp-fuel-ui-fix-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix fuel monitor readability and router edit UX"
          git push origin HEAD:agent/fix-valve-safety
