name: Temporary Valve Safety Patcher

on:
  push:
    branches: [ agent/fix-valve-safety ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/fix-valve-safety
          fetch-depth: 0

      - name: Apply guarded VALVE safety fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import zlib

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected replacement exactly once, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          valve = 'xreactor/nodes/valve/main.lua'
          router = 'xreactor/nodes/fuel/redstone_router.lua'

          replace_once(valve,
          '''local last_command_ts = os.epoch("utc")
          local current_high = config.default_blocked ~= false  -- true = blockiert (Fail-Safe-Default)

          local last_write_error = nil
          local valve_initialized = false''',
          '''local last_command_ts = os.epoch("utc")
          local desired_high = config.default_blocked ~= false
          local current_high = nil  -- nil = physischer Zustand noch nicht erfolgreich bestaetigt

          local last_write_error = nil
          local valve_initialized = false''')

          replace_once(valve,
          '''  local color = current_high and colors.red or colors.green''',
          '''  local color
          if not valve_initialized or last_write_error then
            color = colors.orange
          else
            color = current_high and colors.red or colors.green
          end''')

          replace_once(valve,
          '''  if not ok then
            last_write_error = tostring(err)
            utils.log(CONFIG.LOG_PREFIX, "Ventil-Write fehlgeschlagen (Sorter " .. tostring(sorter_resolved_name or config.sorter_name or "?") .. "): " .. tostring(err), "ERROR")
            return false
          end''',
          '''  if not ok then
            last_write_error = tostring(err)
            render_status_monitor()
            utils.log(CONFIG.LOG_PREFIX, "Ventil-Write fehlgeschlagen (Sorter " .. tostring(sorter_resolved_name or config.sorter_name or "?") .. "): " .. tostring(err), "ERROR")
            return false
          end''')

          replace_once(valve, 'apply_valve(current_high)', 'apply_valve(desired_high)')

          replace_once(valve,
          '''local valve_modem = peripheral.find("modem", function(_, m) return m.isWireless and m.isWireless() end)
          if valve_modem then
            local ok_open = pcall(valve_modem.open, constants.channels.VALVE)
            if ok_open then
              utils.log(CONFIG.LOG_PREFIX, "Eigener Ventil-Kanal " .. constants.channels.VALVE .. " geoeffnet", "INFO")
            else
              utils.log(CONFIG.LOG_PREFIX, "Ventil-Kanal " .. constants.channels.VALVE .. " konnte nicht geoeffnet werden", "ERROR")
            end
          else
            utils.log(CONFIG.LOG_PREFIX, "Kein Wireless Modem gefunden — Ventil-Kanal inaktiv", "ERROR")
          end''',
          '''local function find_valve_modem()
            local configured = type(config.wireless_modem) == "string" and config.wireless_modem or nil
            if configured and configured ~= "" then
              local present_ok, present = pcall(peripheral.isPresent, configured)
              if present_ok and present then
                local wrap_ok, modem = pcall(peripheral.wrap, configured)
                if wrap_ok and modem and type(modem.isWireless) == "function" then
                  local wireless_ok, wireless = pcall(modem.isWireless)
                  if wireless_ok and wireless == true then return modem, configured, nil end
                end
              end
              return nil, configured, "konfiguriertes Wireless Modem nicht verfuegbar oder nicht wireless"
            end

            local resolved_name = nil
            local ok_find, modem = pcall(peripheral.find, "modem", function(name, m)
              if not m or type(m.isWireless) ~= "function" then return false end
              local ok_wireless, wireless = pcall(m.isWireless)
              if ok_wireless and wireless == true then
                resolved_name = name
                return true
              end
              return false
            end)
            if ok_find and modem then return modem, resolved_name, nil end
            return nil, nil, "kein Wireless Modem gefunden"
          end

          local valve_modem, valve_modem_name, valve_modem_error = find_valve_modem()
          if valve_modem then
            local ok_open = pcall(valve_modem.open, constants.channels.VALVE)
            if ok_open then
              utils.log(CONFIG.LOG_PREFIX, "Eigener Ventil-Kanal " .. constants.channels.VALVE .. " geoeffnet via " .. tostring(valve_modem_name or "auto"), "INFO")
            else
              utils.log(CONFIG.LOG_PREFIX, "Ventil-Kanal " .. constants.channels.VALVE .. " konnte nicht geoeffnet werden", "ERROR")
            end
          else
            utils.log(CONFIG.LOG_PREFIX, "Ventil-Kanal inaktiv: " .. tostring(valve_modem_error or "kein Wireless Modem"), "ERROR")
          end''')

          replace_once(valve,
          '''  if message.dst ~= node_id then return end  -- nicht fuer diese Node bestimmt
            -- Feature (2026-07-13): VALVE-P1 (siehe docs/CODING_AI_OTHER_NODES_''',
          '''  if message.dst ~= node_id then return end  -- nicht fuer diese Node bestimmt
            if type(message.src) ~= "string" or message.src == "" then
              utils.log(CONFIG.LOG_PREFIX, "SET_VALVE ohne gueltige 'src' ignoriert", "WARN")
              return
            end
            if type(message.command_id) ~= "string" or message.command_id == "" then
              utils.log(CONFIG.LOG_PREFIX, "SET_VALVE ohne gueltige 'command_id' ignoriert", "WARN")
              return
            end
            if type(message.high) ~= "boolean" then
              utils.log(CONFIG.LOG_PREFIX, "SET_VALVE ohne gueltiges 'high' ignoriert", "WARN")
              return
            end
            -- Feature (2026-07-13): VALVE-P1 (siehe docs/CODING_AI_OTHER_NODES_''')

          replace_once(valve,
          '''  if type(message.high) ~= "boolean" then
            utils.log(CONFIG.LOG_PREFIX, "SET_VALVE ohne gueltiges 'high' ignoriert", "WARN")
            return
          end
          ''', '')

          replace_once(valve, '    applied = (current_high == message.high)', '    applied = valve_initialized and (current_high == message.high)')

          replace_once(valve,
          '''local STALE_COMMAND_S = 20
          services:add({ name = "valve_failsafe", tick = function()
            if last_command_ts and not current_high then
              local age_s = (os.epoch("utc") - last_command_ts) / 1000
              if age_s > STALE_COMMAND_S then
                utils.log(CONFIG.LOG_PREFIX, string.format(
                  "Kein SET_VALVE seit %.0fs — Fail-Safe: Ventil wird blockiert", age_s), "WARN")
                apply_valve(true)
              end
            end
          end })''',
          '''local STALE_COMMAND_S = 20
          local FAILSAFE_RETRY_MS = 2000
          local last_failsafe_attempt_ts = 0
          services:add({ name = "valve_failsafe", tick = function()
            local now_ms = os.epoch("utc")
            local age_s = last_command_ts and ((now_ms - last_command_ts) / 1000) or math.huge
            local needs_block = (not valve_initialized) or current_high ~= true
            local should_retry = (not valve_initialized) or age_s > STALE_COMMAND_S
            if needs_block and should_retry and (now_ms - last_failsafe_attempt_ts) >= FAILSAFE_RETRY_MS then
              last_failsafe_attempt_ts = now_ms
              if not valve_initialized then
                utils.log(CONFIG.LOG_PREFIX, "Aktorzustand unbestaetigt — Fail-Safe: BLOCKIERT wird erneut geschrieben", "WARN")
              else
                utils.log(CONFIG.LOG_PREFIX, string.format(
                  "Kein SET_VALVE seit %.0fs — Fail-Safe: Ventil wird blockiert", age_s), "WARN")
              end
              apply_valve(true)
            end
          end })''')

          replace_once(valve,
          '''local function build_status_payload()
            valve_health.status = comms:is_master_reachable() and health.status.OK or health.status.DEGRADED
            valve_health.reasons = comms:is_master_reachable() and {} or { [health.reasons.COMMS_DOWN] = true }
            valve_health.last_seen_ts = os.epoch("utc")
            return non_rt_payload.build_base({
              ts = os.epoch("utc"), role = config.role, node_id = node_id,
              health = { status = valve_health.status, reasons = health.reasons_list(valve_health), last_seen_ts = valve_health.last_seen_ts },
              master_connected = comms:is_master_reachable(),
              queue = comms and comms:get_diagnostics().queue_depth or 0,
            })
          end''',
          '''local function build_status_payload()
            local master_reachable = comms:is_master_reachable()
            local actuator_ready = valve_initialized and last_write_error == nil
            valve_health.status = (master_reachable and actuator_ready) and health.status.OK or health.status.DEGRADED
            valve_health.reasons = {}
            if not master_reachable then valve_health.reasons[health.reasons.COMMS_DOWN] = true end
            if not actuator_ready then valve_health.reasons[health.reasons.CONTROL_DEGRADED] = true end
            valve_health.last_seen_ts = os.epoch("utc")
            return non_rt_payload.build_base({
              ts = os.epoch("utc"), role = config.role, node_id = node_id,
              health = { status = valve_health.status, reasons = health.reasons_list(valve_health), last_seen_ts = valve_health.last_seen_ts },
              master_connected = master_reachable,
              queue = comms and comms:get_diagnostics().queue_depth or 0,
            })
          end''')

          replace_once(valve,
          '''  heartbeat_state = function() return {
            blocked = current_high, write_error = last_write_error,
            actuator_name = sorter_resolved_name or config.sorter_name,
          } end,''',
          '''  heartbeat_state = function()
            local confirmed_blocked = nil
            if valve_initialized then confirmed_blocked = current_high end
            return {
              blocked = confirmed_blocked,
              actuator_initialized = valve_initialized,
              actuator_ready = valve_initialized and last_write_error == nil,
              write_error = last_write_error,
              actuator_name = sorter_resolved_name or config.sorter_name,
            }
          end,''')

          # Shared router: derive the actual runtime identity from the persisted node-id
          # before falling back to a config value. This covers both FUEL and REPROCESSOR.
          replace_once(router,
          '''local function safe_call(obj, method, ...)
            if not obj or type(obj[method]) ~= "function" then return nil, "no_method" end
            local ok, r = pcall(obj[method], ...)
            if not ok then return nil, tostring(r) end
            return r, nil
          end''',
          '''local function safe_call(obj, method, ...)
            if not obj or type(obj[method]) ~= "function" then return nil, "no_method" end
            local ok, r = pcall(obj[method], ...)
            if not ok then return nil, tostring(r) end
            return r, nil
          end

          local NODE_ID_PATH = "/xreactor/config/node_id.txt"

          local function read_runtime_node_id()
            if type(fs) ~= "table" or type(fs.exists) ~= "function" or type(fs.open) ~= "function" then return nil end
            local ok_exists, exists = pcall(fs.exists, NODE_ID_PATH)
            if not ok_exists or not exists then return nil end
            local ok_open, handle = pcall(fs.open, NODE_ID_PATH, "r")
            if not ok_open or not handle then return nil end
            local ok_read, value = pcall(handle.readAll)
            pcall(handle.close)
            if not ok_read or type(value) ~= "string" then return nil end
            value = value:match("^%s*(.-)%s*$")
            if value == "" then return nil end
            return value
          end

          local function resolve_source_node_id(config)
            local persisted = read_runtime_node_id()
            if persisted then return persisted end
            local configured = config and config.node_id
            if type(configured) == "string" and configured ~= "" then return configured end
            if os and type(os.getComputerID) == "function" then
              return "node-" .. tostring(os.getComputerID())
            end
            return nil
          end

          local function find_wireless_modem(config)
            local configured = config and type(config.wireless_modem) == "string" and config.wireless_modem or nil
            if configured and configured ~= "" then
              local present_ok, present = pcall(peripheral.isPresent, configured)
              if not present_ok or not present then return nil end
              local wrap_ok, modem = pcall(peripheral.wrap, configured)
              if not wrap_ok or not modem or type(modem.isWireless) ~= "function" then return nil end
              local wireless_ok, wireless = pcall(modem.isWireless)
              if wireless_ok and wireless == true then return modem end
              return nil
            end
            local ok_find, modem = pcall(peripheral.find, "modem", function(_, mm)
              if not mm or type(mm.isWireless) ~= "function" then return false end
              local wireless_ok, wireless = pcall(mm.isWireless)
              return wireless_ok and wireless == true
            end)
            if ok_find then return modem end
            return nil
          end''')

          replace_once(router,
          '''  -- Feature (2026-07-09): eigener, dedizierter Funkkanal fuer SET_VALVE
            -- (constants.channels.VALVE = 6504), bewusst getrennt von der normalen
            -- comms_service-Pipeline (kein CONTROL/STATUS-Traffic) -- roh per
            -- modem.transmit, kein Ack/Retry-Overhead.
            local valve_modem = nil
            local ok_find, m = pcall(peripheral.find, "modem", function(_, mm) return mm.isWireless and mm.isWireless() end)
            if ok_find and m then
              valve_modem = m
              pcall(valve_modem.open, constants.channels.VALVE)
            end
            local self = {
              config = opts.config or {},''',
          '''  -- Feature (2026-07-09): eigener, dedizierter Funkkanal fuer SET_VALVE
            -- (constants.channels.VALVE = 6504), bewusst getrennt von der normalen
            -- comms_service-Pipeline. Ein explizites wireless_modem wird respektiert;
            -- ohne Override bleibt die bisherige automatische Suche erhalten.
            local router_config = opts.config or {}
            local valve_modem = find_wireless_modem(router_config)
            if valve_modem then pcall(valve_modem.open, constants.channels.VALVE) end
            local self = {
              config = router_config,
              source_node_id = opts.node_id or resolve_source_node_id(router_config),''')

          replace_once(router,
          '''      self._state.command_seq = (self._state.command_seq or 0) + 1
                local command_id = tostring(self.config.node_id or "FUEL") .. "-" .. tostring(os.epoch and os.epoch("utc") or 0) .. "-" .. tostring(self._state.command_seq)
                local key = valve.integrator .. "|" .. tostring(side)
                local message = {
                  type = "SET_VALVE", src = self.config.node_id, dst = w.node_id,
                  command_id = command_id, side = side, high = high, ts = os.epoch and os.epoch("utc") or 0,
                }''',
          '''      local source_node_id = self.source_node_id
                if type(source_node_id) ~= "string" or source_node_id == "" then
                  self.warn_once("missing_valve_source_id", "RedstoneRouter: keine gueltige Runtime-Node-ID fuer SET_VALVE; Netzwerkschaltung verweigert")
                  return false
                end
                self._state.command_seq = (self._state.command_seq or 0) + 1
                local command_id = source_node_id .. "-" .. tostring(os.epoch and os.epoch("utc") or 0) .. "-" .. tostring(self._state.command_seq)
                local key = valve.integrator .. "|" .. tostring(side)
                local message = {
                  type = "SET_VALVE", src = source_node_id, dst = w.node_id,
                  command_id = command_id, side = side, high = high, ts = os.epoch and os.epoch("utc") or 0,
                }''')

          replace_once(router,
          '''        command_id = command_id, dst = w.node_id, side = side, high = high,
                  integrator = valve.integrator, sent_ts = message.ts, retries = 0,''',
          '''        command_id = command_id, src = source_node_id, dst = w.node_id, side = side, high = high,
                  integrator = valve.integrator, sent_ts = message.ts, retries = 0,''')

          replace_once(router,
          '''    if entry.command_id == message.command_id then
                pending[key] = nil
                self._state.confirmed_valve_state = self._state.confirmed_valve_state or {}''',
          '''    if entry.command_id == message.command_id then
                if message.src ~= entry.dst or message.dst ~= entry.src then
                  self.warn_once("valve_ack_identity:" .. tostring(key) .. ":" .. tostring(message.command_id),
                    "RedstoneRouter: VALVE_ACK mit unpassender src/dst-Identitaet ignoriert")
                  return
                end
                pending[key] = nil
                self._state.confirmed_valve_state = self._state.confirmed_valve_state or {}''')

          replace_once(router,
          '''          type = "SET_VALVE", src = self.config.node_id, dst = entry.dst,
                    command_id = entry.command_id, side = entry.side, high = entry.high, ts = now,''',
          '''          type = "SET_VALVE", src = entry.src, dst = entry.dst,
                    command_id = entry.command_id, side = entry.side, high = entry.high, ts = now,''')

          # Release/manifest version bump.
          release = Path('xreactor/release.lua')
          release_text = release.read_text(encoding='utf-8')
          for old, new in [
              ('release_id = "beta-v505"', 'release_id = "beta-v506"'),
              ('manifest_id = "manifest-v505"', 'manifest_id = "manifest-v506"'),
              ('manifest_version = 505', 'manifest_version = 506'),
          ]:
              if release_text.count(old) != 1:
                  raise SystemExit(f'release.lua: expected exactly one {old!r}')
              release_text = release_text.replace(old, new, 1)
          release.write_text(release_text, encoding='utf-8')

          manifest = Path('xreactor/manifest.lua')
          manifest_text = manifest.read_text(encoding='utf-8')
          for old, new in [
              ('manifest_version = 505', 'manifest_version = 506'),
              ('manifest_id = "manifest-v505"', 'manifest_id = "manifest-v506"'),
          ]:
              if manifest_text.count(old) != 1:
                  raise SystemExit(f'manifest.lua: expected exactly one {old!r}')
              manifest_text = manifest_text.replace(old, new, 1)

          def crc32_hex(data):
              return f'{zlib.crc32(data) & 0xffffffff:08x}'

          for rel in ['nodes/valve/main.lua', 'nodes/fuel/redstone_router.lua', 'release.lua']:
              data = (Path('xreactor') / rel).read_bytes()
              size = len(data)
              digest = crc32_hex(data)
              pattern = re.compile(r'(\{\s*path\s*=\s*"' + re.escape(rel) + r'"\s*,\s*size_bytes\s*=\s*)\d+(\s*,\s*hash\s*=\s*")[0-9a-f]+("[^\n]*\})')
              manifest_text, count = pattern.subn(lambda m: f'{m.group(1)}{size}{m.group(2)}{digest}{m.group(3)}', manifest_text, count=1)
              if count != 1:
                  raise SystemExit(f'manifest.lua: could not update exactly one entry for {rel}; count={count}')
          manifest.write_text(manifest_text, encoding='utf-8')

          # Regression tests are intentionally outside the runtime manifest.
          Path('tests/valve_safety_regression_test.py').write_text(r'''#!/usr/bin/env python3
          from pathlib import Path

          repo = Path(__file__).resolve().parents[1]
          valve = (repo / 'xreactor/nodes/valve/main.lua').read_text(encoding='utf-8')
          router = (repo / 'xreactor/nodes/fuel/redstone_router.lua').read_text(encoding='utf-8')

          assert 'local current_high = nil' in valve, 'physical valve state must start unknown until a write succeeds'
          assert 'apply_valve(desired_high)' in valve, 'boot must write the desired fail-safe state explicitly'
          assert 'local needs_block = (not valve_initialized) or current_high ~= true' in valve
          assert 'actuator_initialized = valve_initialized' in valve
          assert 'if valve_initialized then confirmed_blocked = current_high end' in valve
          assert 'config.wireless_modem' in valve and 'pcall(peripheral.wrap, configured)' in valve

          src_check = valve.index('if type(message.src) ~= "string" or message.src == "" then')
          command_check = valve.index('if type(message.command_id) ~= "string" or message.command_id == "" then')
          high_check = valve.index('if type(message.high) ~= "boolean" then')
          pair = valve.index('config.trusted_source = message.src')
          assert src_check < pair and command_check < pair and high_check < pair, 'invalid first packet must never pair the VALVE'

          assert 'local NODE_ID_PATH = "/xreactor/config/node_id.txt"' in router
          assert 'source_node_id = opts.node_id or resolve_source_node_id(router_config)' in router
          assert 'type = "SET_VALVE", src = source_node_id, dst = w.node_id' in router
          assert 'message.src ~= entry.dst or message.dst ~= entry.src' in router
          assert 'type = "SET_VALVE", src = entry.src, dst = entry.dst' in router

          print('valve_safety_regression_test.py: ok')
          ''', encoding='utf-8')

          Path('tests/redstone_router_valve_identity_test.lua').write_text(r'''package.path = table.concat({ './xreactor/?.lua', './xreactor/?/init.lua', package.path }, ';')

          local transmissions = {}
          local modem = {
            isWireless = function() return true end,
            open = function() end,
            transmit = function(_, _, message) transmissions[#transmissions + 1] = message end,
          }

          _G.fs = {
            exists = function(path) return path == '/xreactor/config/node_id.txt' end,
            open = function(path, mode)
              assert(path == '/xreactor/config/node_id.txt' and mode == 'r')
              return { readAll = function() return 'node-77\n' end, close = function() end }
            end,
          }
          _G.peripheral = {
            find = function(kind, filter)
              if kind == 'modem' and (not filter or filter('right', modem)) then return modem end
              return nil
            end,
            isPresent = function() return false end,
            wrap = function() return nil end,
          }
          _G.redstone = { setOutput = function() end }

          package.loaded['nodes.fuel.redstone_router'] = nil
          local redstone_router = require('nodes.fuel.redstone_router')
          local peers = { ['VALVE-1'] = { down = false } }
          local router = redstone_router.new({
            config = {
              node_id = 'ROLE-DEFAULT-SHOULD-NOT-WIN',
              logistics = {
                redstone_tree = {
                  { reactor = 'R1', path = { { side = 'left', integrator = 'VALVE-1' } } },
                },
              },
            },
            comms = { get_peers = function() return peers end },
            log = function() end,
            warn_once = function() end,
          })

          router:refresh()
          assert(#transmissions >= 1, 'refresh must issue the fail-safe block command')
          local sent = transmissions[#transmissions]
          assert(sent.src == 'node-77', 'persisted runtime node id must be the SET_VALVE sender')
          assert(sent.command_id:match('^node%-77%-'), 'command id must be namespaced by the same runtime identity')

          local key = 'VALVE-1|left'
          local pending = router._state.pending_valve_acks[key]
          assert(pending and pending.src == 'node-77' and pending.dst == 'VALVE-1')

          router:handle_valve_ack({
            type = 'VALVE_ACK', command_id = pending.command_id,
            src = 'VALVE-EVIL', dst = 'node-77', applied = true, high = true,
          })
          assert(router._state.pending_valve_acks[key] ~= nil, 'wrong ACK src must not clear pending command')

          router:handle_valve_ack({
            type = 'VALVE_ACK', command_id = pending.command_id,
            src = 'VALVE-1', dst = 'someone-else', applied = true, high = true,
          })
          assert(router._state.pending_valve_acks[key] ~= nil, 'wrong ACK dst must not clear pending command')

          router:handle_valve_ack({
            type = 'VALVE_ACK', command_id = pending.command_id,
            src = 'VALVE-1', dst = 'node-77', applied = true, high = true,
          })
          assert(router._state.pending_valve_acks[key] == nil, 'matching ACK identity must clear pending command')
          assert(router._state.confirmed_valve_state[key].command_id == pending.command_id)

          local ok, command_id = router:_set_valve({ side = 'left', integrator = 'VALVE-1' }, false)
          assert(ok and command_id)
          local retry = router._state.pending_valve_acks[key]
          retry.sent_ts = -4000
          router:check_pending_acks()
          local resent = transmissions[#transmissions]
          assert(resent.command_id == command_id and resent.src == 'node-77', 'retry must preserve sender identity')

          print('redstone_router_valve_identity_test.lua: ok')
          ''', encoding='utf-8')
          PY

      - name: Validate targeted patch
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.2
