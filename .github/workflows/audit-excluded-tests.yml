name: temporary final audit fix

on:
  push:
    branches:
      - agent/repo-safety-audit-fixes

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repo-safety-audit-fixes
          fetch-depth: 0
      - name: Apply final audit fixes
        run: python3 .github/audit_fix_phase7.py
      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.2
      - name: Validate manifest and syntax
        run: |
          lua5.2 tools/offline_validate.lua
          python3 tools/validate_manifest.py --strict
          python3 scripts/manifest_sync.py --check
      - name: Run complete zero-exclusion suites
        run: |
          bash tools/run_lua_tests.sh lua5.2
          bash tools/run_python_tests.sh python3
      - name: Commit final audit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/audit_fix_phase7.py .github/workflows/audit-excluded-tests.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: close remaining repo audit gaps"
          git push origin HEAD:agent/repo-safety-audit-fixes
